<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>로그인 | MathSite</title>
        <link rel="stylesheet" href="/static/shared/style.css" />
    </head>
    <body>
        <header id="header"></header>
        <main>
            <h2>로그인</h2>
            <p id="message" role="status"></p>
            <p><a href="/auth/kakao">카카오 로그인</a></p>
            <details>
                <summary>이메일 로그인</summary>
                <form id="login-form">
                    <label>
                        이메일
                        <input name="email" type="email" autocomplete="username" required />
                    </label>
                    <label>
                        비밀번호
                        <input
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                        />
                    </label>
                    <button>로그인</button>
                </form>
            </details>
            <section id="register" hidden>
                <h3>가입 정보 입력</h3>
                <p>카카오 인증을 완료했습니다. 가입 신청 후 관리자 승인이 필요합니다.</p>
                <form id="register-form">
                    <label>
                        이름
                        <input name="name" maxlength="80" required />
                    </label>
                    <label>
                        이메일
                        <input name="email" type="email" required />
                    </label>
                    <button>가입 신청</button>
                </form>
            </section>
        </main>
        <script type="module" src="/static/pages/auth/login.js"></script>
    </body>
</html>
